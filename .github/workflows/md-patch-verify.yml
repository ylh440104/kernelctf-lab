name: md-patch-verify

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libssl-dev libelf-dev libncurses-dev bc pkg-config

      - name: clone linux
        run: |
          git clone --depth 1 https://github.com/torvalds/linux.git /tmp/src
          echo "HEAD=$(git -C /tmp/src rev-parse --short HEAD)"

      - name: apply patch
        run: |
          cp md_patch/md_fix.patch /tmp/md_fix.patch
          echo "=== patch bytes: $(wc -c < /tmp/md_fix.patch) ==="
          cd /tmp/src
          git apply --check /tmp/md_fix.patch && echo APPLY_CHECK_OK || echo APPLY_CHECK_FAIL
          git apply /tmp/md_fix.patch && echo APPLIED || echo APPLY_FAIL
          echo "=== verify hunks present ==="
          grep -n "min_t(int, mddev->raid_disks, MD_SB_DISKS)" drivers/md/md.c
          grep -n "n > MD_SB_DISKS" drivers/md/md.c

      - name: compile drivers/md
        run: |
          cd /tmp/src
          make defconfig
          make prepare modules_prepare -j$(nproc) > /tmp/prep.log 2>&1 || { echo PREP_FAIL; tail -50 /tmp/prep.log; exit 1; }
          echo PREP_OK
          make drivers/md/ -j$(nproc) > /tmp/build.log 2>&1
          RC=$?
          echo "build_rc=$RC"
          tail -30 /tmp/build.log
          if [ $RC -ne 0 ]; then echo BUILD_FAIL; exit 1; fi
          ls -la drivers/md/md.o 2>/dev/null || ls -la drivers/md/*.o | head
          echo BUILD_OK

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            /tmp/build.log
            /tmp/prep.log
          if-no-files-found: warn
          retention-days: 30
