name: send-dm-integrity

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = do not send'
        required: true
        default: 'true'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: send patch
        env:
          GMAIL_USER: ylh440104@gmail.com
          GMAIL_PASS: ${{ secrets.GMAIL_APP_PASS }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python3 - << 'PYEOF'
          import os, smtplib, ssl
          from email.message import EmailMessage
          from email.utils import formatdate, make_msgid

          USER = os.environ['GMAIL_USER']
          PASS = os.environ['GMAIL_PASS']
          DRY = os.environ['DRY_RUN'].lower() == 'true'

          subj = 'dm-integrity: reject recalculation when recalc_wq was never allocated'
          body = open('dm_patch/dm_body.txt', encoding='utf-8').read()
          diff = open('dm_patch/dm_fix.patch', encoding='utf-8').read()

          msg = EmailMessage()
          msg['Subject'] = '[PATCH] ' + subj
          msg['From'] = 'Yang Luohan <%s>' % USER
          msg['To'] = 'Mikulas Patocka <mpatocka@redhat.com>'
          msg['Cc'] = ('dm-devel@lists.linux.dev, linux-kernel@vger.kernel.org, '
                       'Mike Snitzer <snitzer@kernel.org>, '
                       'Benjamin Marzinski <bmarzins@redhat.com>')
          msg['Date'] = formatdate(localtime=True)
          msg['Message-Id'] = make_msgid(domain='gmail.com')
          msg.set_content(body.rstrip() + '\n\n' + diff, subtype='plain', charset='utf-8')

          print('From   :', msg['From'])
          print('To     :', msg['To'])
          print('Cc     :', msg['Cc'])
          print('Subject:', msg['Subject'])
          print('Size   :', len(str(msg)))
          print('--- body head ---')
          print(body[:300])
          print('--- diff head ---')
          print(diff[:400])

          if DRY:
              print('DRY RUN, not sending')
          else:
              ctx = ssl.create_default_context()
              with smtplib.SMTP_SSL('smtp.gmail.com', 465, context=ctx, timeout=60) as s:
                  s.login(USER, PASS)
                  s.send_message(msg)
              print('SENT OK')
          PYEOF