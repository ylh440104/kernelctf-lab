name: boot
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  real-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cpio gzip curl busybox-static
          qemu-system-x86_64 --version | head -1
          ls -l /bin/busybox

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: download official kernels
        run: |
          B=https://storage.googleapis.com/kernelctf-build/releases
          curl -fsSL "$B/hardened-v1-7.2-rc5/bzImage" -o bz-hardened
          curl -fsSL "$B/lts-6.12.116-kasan/bzImage" -o bz-kasan
          ls -lh bz-hardened bz-kasan

      - name: build initramfs with busybox
        run: |
          rm -rf rootfs
          mkdir -p rootfs/bin rootfs/dev rootfs/proc rootfs/sys rootfs/tmp
          cp /bin/busybox rootfs/bin/busybox
          for a in sh mount cat grep tr cut ls uname echo poweroff sleep; do
            ln -sf busybox rootfs/bin/$a
          done
          cp guest_init.sh rootfs/init
          chmod +x rootfs/init rootfs/bin/busybox
          cd rootfs && find . | cpio -o -H newc 2>/dev/null | gzip -9 > ../initramfs.cpio.gz
          cd .. && ls -lh initramfs.cpio.gz
          echo "=== cpio content ==="
          gzip -dc initramfs.cpio.gz | cpio -t 2>/dev/null | head -20

      - name: boot hardened target
        run: |
          echo "=== BOOTING hardened-v1-7.2-rc5 ==="
          timeout 180 qemu-system-x86_64 -accel kvm -m 2048 -M q35 -smp 2 \
            -cpu host -kernel bz-hardened -initrd initramfs.cpio.gz \
            -append "console=ttyS0 panic=-1" -nographic -no-reboot 2>&1 | tail -35
          echo "HARDENED_DONE"

      - name: boot hardened without CET
        run: |
          echo "=== hardened with -cpu qemu64 (NO CET) ==="
          timeout 180 qemu-system-x86_64 -accel kvm -m 2048 -M q35 -smp 2 \
            -cpu qemu64 -kernel bz-hardened -initrd initramfs.cpio.gz \
            -append "console=ttyS0 panic=-1" -nographic -no-reboot 2>&1 | tail -20
          echo "NOCET_DONE"

      - name: boot lts kasan
        run: |
          echo "=== BOOTING lts-6.12.116-kasan ==="
          timeout 240 qemu-system-x86_64 -accel kvm -m 3072 -M q35 -smp 2 \
            -cpu host -kernel bz-kasan -initrd initramfs.cpio.gz \
            -append "console=ttyS0 panic=-1" -nographic -no-reboot 2>&1 | tail -25
          echo "KASAN_DONE"