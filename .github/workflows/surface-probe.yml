name: surface-probe

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        required: true
        default: '43774253899'
      target:
        required: true
        default: 'hardened'
      probe_file:
        required: true
        default: 'probes/06_trace_surface.c'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs debootstrap gcc

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: download kernel
        uses: actions/download-artifact@v4
        with:
          name: kernelobj-${{ github.event.inputs.target }}-kcov
          path: work/kernel
          run-id: ${{ github.event.inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: compile probe
        run: |
          mkdir -p work/bin
          gcc -O1 -static -o work/bin/probe "${{ github.event.inputs.probe_file }}" 2>&1 | tail -5
          ls -lh work/bin/probe
          file work/bin/probe | head -1

      - name: make rootfs
        run: |
          mkdir -p work/img
          curl -sL --max-time 60 https://raw.githubusercontent.com/google/syzkaller/master/tools/create-image.sh -o /tmp/create-image.sh
          chmod +x /tmp/create-image.sh
          cd work/img
          sudo env ADD_PACKAGE="openssh-server,iproute2,net-tools,isc-dhcp-client,ifupdown,strace,procps" bash /tmp/create-image.sh -d trixie 2>&1 | tail -8
          sudo chown -R "$(id -u):$(id -g)" trixie.img trixie.id_rsa
          sudo mkdir -p /tmp/mnt && sudo mount -o loop trixie.img /tmp/mnt
          sudo mkdir -p /tmp/mnt/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /lib/systemd/system/networking.service /tmp/mnt/etc/systemd/system/multi-user.target.wants/networking.service
          sudo cp "$GITHUB_WORKSPACE/work/bin/probe" /tmp/mnt/root/probe
          sudo chmod 755 /tmp/mnt/root/probe
          grep -q '^nobody:' /tmp/mnt/etc/passwd || echo 'nobody:x:65534:65534:nobody:/nonexistent:/usr/sbin/nologin' | sudo tee -a /tmp/mnt/etc/passwd > /dev/null
          sudo umount /tmp/mnt
          chmod 600 trixie.id_rsa
          ls -lh

      - name: boot and run probe
        run: |
          IMG="$GITHUB_WORKSPACE/work/img/trixie.img"
          KEY="$GITHUB_WORKSPACE/work/img/trixie.id_rsa"
          chmod 600 "$KEY"
          qemu-system-x86_64 -enable-kvm -cpu host -m 3072 -smp 2 \
            -kernel work/kernel/bzImage \
            -hda "$IMG" \
            -append "root=/dev/sda console=ttyS0 oops=panic panic=1 net.ifnames=0" \
            -net nic,model=e1000 -net user,hostfwd=tcp::10022-:22 \
            -nographic -no-reboot > vm.log 2>&1 &
          QPID=$!
          echo "qemu=$QPID"
          for t in $(seq 1 8); do
            sleep 20
            nc -z 127.0.0.1 10022 2>/dev/null && { echo "SSH READY at t=$t"; break; }
            echo "waiting $t"
          done
          SSH="ssh -i $KEY -p 10022 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR root@127.0.0.1"
          echo "=== as root ==="
          $SSH '/root/probe' 2>&1 | tee probe_root.txt || echo PROBE_ROOT_FAIL
          echo
          echo "=== as nobody (uid 65534) ==="
          $SSH 'chmod 755 /root; cp /root/probe /tmp/probe; chmod 755 /tmp/probe; setpriv --reuid=65534 --regid=65534 --clear-groups /tmp/probe' 2>&1 | tee probe_nobody.txt || echo PROBE_NOBODY_FAIL
          echo
          echo "=== dmesg tail ==="
          $SSH 'dmesg | tail -20' 2>&1 || true
          kill $QPID 2>/dev/null || true
          sleep 2
          echo "=== vm.log tail ==="
          tail -5 vm.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-output
          path: |
            probe_root.txt
            probe_nobody.txt
            vm.log
          if-no-files-found: warn
          retention-days: 30