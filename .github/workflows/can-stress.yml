      - name: prepare image
        run: |
          mkdir -p work/img
          curl -sL --max-time 60 https://raw.githubusercontent.com/google/syzkaller/master/tools/create-image.sh -o /tmp/create-image.sh
          chmod +x /tmp/create-image.sh
          cd work/img
          sudo env ADD_PACKAGE="openssh-server,iproute2,net-tools,isc-dhcp-client,ifupdown,procps,util-linux,kmod" bash /tmp/create-image.sh -d trixie 2>&1 | tail -3
          sudo chown -R "$(id -u):$(id -g)" trixie.img trixie.id_rsa
          cp "$GITHUB_WORKSPACE/work/bin/probe" ./probe
          ls -lh
      - name: install probe into image
        run: |
          cd work/img
          D="${{ github.event.inputs.duration }}"
          I="${{ github.event.inputs.instances }}"
          {
            echo '#!/bin/bash'
            echo 'exec > /dev/console 2>&1'
            echo 'echo "=== PROBECAN START ==="'
            echo 'uname -a'
            echo 'ip link add dev vcan0 type vcan 2>/dev/null; ip link set dev vcan0 up 2>/dev/null'
            echo 'ip link show vcan0'
            echo 'ls /proc/net/can/ 2>/dev/null'
            for k in $(seq 1 $I); do
              echo "/root/probe $D > /root/out$k.log 2>&1 &"
            done
            echo 'wait'
            echo 'echo "=== PROBECAN END ==="'
            echo '{'
            for k in $(seq 1 $I); do echo "  cat /root/out$k.log"; done
            echo '} > /root/result.txt 2>&1'
            echo 'sync'
            echo 'poweroff -f'
          } > autorun.sh
          chmod 755 autorun.sh
          cat autorun.sh
          sudo mkdir -p /tmp/mnt
          sudo mount -o loop trixie.img /tmp/mnt
          sudo cp probe /tmp/mnt/root/probe
          sudo cp autorun.sh /tmp/mnt/root/autorun.sh
          sudo chmod 755 /tmp/mnt/root/probe /tmp/mnt/root/autorun.sh
          sudo mkdir -p /tmp/mnt/etc/systemd/system/multi-user.target.wants
          printf '%s\n' '[Unit]' 'Description=autorun probe' 'After=multi-user.target' '' '[Service]' 'Type=oneshot' 'ExecStart=/root/autorun.sh' 'StandardOutput=null' 'StandardError=null' 'TTYPath=/dev/ttyS0' 'StandardInput=null' 'Restart=no' '' '[Install]' 'WantedBy=multi-user.target' | sudo tee /tmp/mnt/etc/systemd/system/autorun.service > /dev/null
          sudo ln -sf /etc/systemd/system/autorun.service /tmp/mnt/etc/systemd/system/multi-user.target.wants/autorun.service
          sudo umount /tmp/mnt
          ls -lh trixie.img
      - name: boot and collect
        run: |
          set +e
          K=$(find work/kernel -name 'bzImage' | head -1)
          IMG="$GITHUB_WORKSPACE/work/img/trixie.img"
          SECS="${{ github.event.inputs.duration }}"
          LIMIT=$((SECS + 180))
          timeout ${LIMIT} qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 4 \
            -kernel "$K" -drive "file=$IMG,format=raw,if=virtio" \
            -append "root=/dev/vda console=ttyS0 oops=panic panic=1 net.ifnames=0 numa=fake=1" \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -nographic -no-reboot > serial.log 2>&1
          echo "=== serial size: $(wc -c < serial.log) ==="
          echo "=== markers ==="
          grep -icE 'BUG: KASAN|general protection fault|use-after-free|WARNING:|kernel BUG|Kernel panic' serial.log
          grep -nE 'BUG: KASAN|general protection|use-after-free|WARNING:|kernel BUG|Kernel panic|Call Trace' serial.log | head -60
          sync
          sudo mkdir -p /tmp/rmnt
          sudo mount -o loop "$IMG" /tmp/rmnt
          sudo cp /tmp/rmnt/root/result.txt ./result.txt 2>/dev/null || echo NO_RESULT_FILE > result.txt
          sudo umount /tmp/rmnt
          echo "=== RESULT ==="
          cat result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: can-stress-output
          path: |
            serial.log
            result.txt