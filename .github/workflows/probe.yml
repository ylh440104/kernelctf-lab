name: probe
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  env-probe:
    runs-on: ubuntu-latest
    steps:
      - name: runner info
        run: |
          echo "=== CPU ==="
          nproc
          grep -m1 'model name' /proc/cpuinfo
          echo "=== FLAGS ==="
          grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(vmx|svm|ibt|shstk)$' | tr '\n' ' '; echo
          echo "=== MEM ==="
          free -h
          echo "=== DISK ==="
          df -h /
          echo "=== KVM DEV ==="
          ls -l /dev/kvm 2>&1 || echo NO_DEV_KVM
          echo "=== KVM MODULE ==="
          lsmod | grep -i kvm || echo NO_KVM_MODULE
          echo "=== NESTED ==="
          cat /sys/module/kvm_intel/parameters/nested 2>&1 || echo NO_NESTED_PARAM
          echo "=== VIRT ==="
          systemd-detect-virt 2>&1 || echo NO_DETECT
          echo "=== OS ==="
          cat /etc/os-release | head -2
