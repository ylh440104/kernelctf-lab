name: syzkaller-fuzz

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        required: true
        default: '43774253899'
      target:
        required: true
        default: 'hardened'
      fuzz_minutes:
        required: true
        default: '20'
      sandbox:
        required: true
        default: 'none'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs debootstrap
          go version

      - name: build syzkaller
        run: |
          git clone --depth 1 https://github.com/google/syzkaller.git
          cd syzkaller
          make -j$(nproc) TARGETOS=linux TARGETVMARCH=amd64 TARGETARCH=amd64 all 2>&1 | tail -8
          ls -lh bin/linux_amd64/syz-executor

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: download kernel
        uses: actions/download-artifact@v4
        with:
          name: kernelobj-${{ github.event.inputs.target }}-kcov
          path: work/kernel
          run-id: ${{ github.event.inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: make rootfs and enable networking
        run: |
          mkdir -p work/img
          cd syzkaller/tools
          sudo env ADD_PACKAGE="isc-dhcp-client,ifupdown,iproute2,net-tools,openssh-server,curl,tar,gcc,libc6-dev,time,strace,sudo,less,psmisc" ./create-image.sh -d trixie
          sudo chown -R "$(id -u):$(id -g)" trixie.img trixie.id_rsa
          sudo mkdir -p /tmp/mnt
          sudo mount -o loop trixie.img /tmp/mnt
          echo "=== BEFORE: networking.service 是否启用 ==="
          sudo ls -la /tmp/mnt/etc/systemd/system/multi-user.target.wants/ 2>/dev/null | head -5
          echo "=== 启用 networking.service (关键!) ==="
          sudo mkdir -p /tmp/mnt/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /lib/systemd/system/networking.service /tmp/mnt/etc/systemd/system/multi-user.target.wants/networking.service
          sudo ln -sf /dev/null /tmp/mnt/etc/systemd/system/network-online.target.wants/networking.service 2>/dev/null || \
            (sudo mkdir -p /tmp/mnt/etc/systemd/system/network-online.target.wants && sudo ln -sf /lib/systemd/system/networking.service /tmp/mnt/etc/systemd/system/network-online.target.wants/networking.service)
          sudo ln -sf /lib/systemd/system/ifupdown-wait-online.service /tmp/mnt/etc/systemd/system/network-online.target.wants/ifupdown-wait-online.service 2>/dev/null || true
          echo "=== AFTER ==="
          sudo ls -la /tmp/mnt/etc/systemd/system/multi-user.target.wants/ | grep network
          echo "=== interfaces 内容 ==="
          sudo cat /tmp/mnt/etc/network/interfaces
          echo "=== dhclient 存在? ==="
          sudo ls -la /tmp/mnt/sbin/dhclient /tmp/mnt/sbin/ifup 2>&1 | head -3
          echo "=== 拷贝 executor 进去备用 ==="
          sudo cp "$GITHUB_WORKSPACE/syzkaller/bin/linux_amd64/syz-executor" /tmp/mnt/root/ 2>/dev/null || true
          sudo umount /tmp/mnt
          cp trixie.img trixie.id_rsa "$GITHUB_WORKSPACE/work/img/"
          chmod 600 "$GITHUB_WORKSPACE/work/img/trixie.id_rsa"
          ls -lh "$GITHUB_WORKSPACE/work/img/"

      - name: write config
        run: |
          WS="$GITHUB_WORKSPACE"
          SB="${{ github.event.inputs.sandbox }}"
          sed -e "s|@WS@|$WS|g" -e "s|@SANDBOX@|$SB|g" "$WS/syz/syz-config.json" > work/config.cfg
          cat work/config.cfg
          mkdir -p work/syz-workdir

      - name: run syz-manager
        run: |
          cd work
          MINS=${{ github.event.inputs.fuzz_minutes }}
          "$GITHUB_WORKSPACE/syzkaller/bin/syz-manager" -config config.cfg > syz-manager.log 2>&1 &
          MPID=$!
          echo "manager pid $MPID, run for $MINS minutes"
          for i in $(seq 1 $MINS); do
            sleep 60
            if [ $((i % 4)) -eq 0 ]; then
              echo "--- minute $i ---"
              grep -E 'executed programs|corpus|coverage|crash' syz-manager.log | tail -3 || true
            fi
          done
          pkill -INT -f 'syz-manager' || true
          sleep 25
          pkill -f 'syz-manager' || true
          echo "=== manager stopped ==="

      - name: collect results
        if: always()
        run: |
          if [ ! -d work ]; then echo "WORK_DIR_MISSING"; exit 0; fi
          cd work
          echo "=========== HEAD 80 ==========="
          head -80 syz-manager.log 2>/dev/null
          echo "=========== TAIL 60 ==========="
          tail -60 syz-manager.log 2>/dev/null
          echo "=========== crash count ==========="
          find syz-workdir/crashes -name '*.log' 2>/dev/null | wc -l
          echo "=========== all VM events ==========="
          grep -E 'VM [0-9]:|boot error|executed programs' syz-manager.log 2>/dev/null | head -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syz-results
          path: |
            work/syz-manager.log
            work/config.cfg
            work/syz-workdir/crashes/**
          if-no-files-found: warn
          retention-days: 90