name: syzkaller-fuzz

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Run ID of build-kcov-v3'
        required: true
        default: '43774253899'
      target:
        description: 'hardened or lts-kasan'
        required: true
        default: 'hardened'
      fuzz_minutes:
        description: 'Fuzz duration in minutes'
        required: true
        default: '60'
      sandbox:
        description: 'sandbox: none or setuid'
        required: true
        default: 'none'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs \
            build-essential flex bison libssl-dev libelf-dev libncurses-dev \
            bc pkg-config debootstrap
          go version

      - name: build syzkaller
        run: |
          git clone --depth 1 https://github.com/google/syzkaller.git
          cd syzkaller
          make -j$(nproc) TARGETOS=linux TARGETVMARCH=amd64 TARGETARCH=amd64 all 2>&1 | tail -15
          ls -lh bin/ | head -10

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm && echo KVM_READY || echo KVM_FAIL

      - name: download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernelobj-${{ github.event.inputs.target }}-kcov
          path: work/kernel
          run-id: ${{ github.event.inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: inspect kernel
        run: |
          ls -lh work/kernel/
          file work/kernel/bzImage

      - name: make rootfs with static ip
        run: |
          mkdir -p work/img
          cd syzkaller/tools
          sudo ./create-image.sh -d bullseye
          sudo chown -R "$(id -u):$(id -g)" bullseye.img bullseye.id_rsa
          sudo mkdir -p /tmp/mnt
          sudo mount -o loop bullseye.img /tmp/mnt
          printf '%s\n' '[Match]' 'Name=eth0' '' '[Network]' 'Address=10.0.2.15/24' 'Gateway=10.0.2.2' 'DNS=10.0.2.3' \
            | sudo tee /tmp/mnt/etc/systemd/network/10-eth0.network
          sudo mkdir -p /tmp/mnt/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /lib/systemd/system/systemd-networkd.service /tmp/mnt/etc/systemd/system/multi-user.target.wants/systemd-networkd.service
          ls -la /tmp/mnt/etc/systemd/system/multi-user.target.wants/ | grep networkd || echo LINK_FAIL
          sudo umount /tmp/mnt
          cp bullseye.img bullseye.id_rsa "$GITHUB_WORKSPACE/work/img/"
          cd "$GITHUB_WORKSPACE/work/img"
          chmod 600 bullseye.id_rsa
          ls -lh

      - name: write config
        run: |
          WS="$GITHUB_WORKSPACE"
          SB="${{ github.event.inputs.sandbox }}"
          sed -e "s|@WS@|$WS|g" -e "s|@SANDBOX@|$SB|g" "$WS/syz/syz-config.json" > work/config.cfg
          cat work/config.cfg
          mkdir -p work/syz-workdir

      - name: run syz-manager
        run: |
          cd work
          MINS=${{ github.event.inputs.fuzz_minutes }}
          sudo -E "$GITHUB_WORKSPACE/syzkaller/bin/syz-manager" -config config.cfg > syz-manager.log 2>&1 &
          MPID=$!
          echo "manager pid $MPID, will run for $MINS minutes"
          for i in $(seq 1 $MINS); do
            sleep 60
            if [ $((i % 5)) -eq 0 ]; then
              echo "--- minute $i ---"
              grep -E 'executed programs|corpus|coverage|crash' syz-manager.log | tail -3 || true
            fi
          done
          sudo pkill -INT -f 'syz-manager' || true
          sleep 25
          sudo pkill -f 'syz-manager' || true
          echo "=== manager stopped ==="

      - name: collect results
        if: always()
        run: |
          if [ ! -d work ]; then echo "WORK_DIR_MISSING"; exit 0; fi
          cd work
          echo "=== crash count ==="
          find syz-workdir/crashes -name '*.log' 2>/dev/null | wc -l
          echo "=== manager log tail ==="
          tail -60 syz-manager.log 2>/dev/null || echo NO_LOG

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syz-results
          path: |
            work/syz-manager.log
            work/config.cfg
            work/syz-workdir/crashes/**
          if-no-files-found: warn
          retention-days: 90