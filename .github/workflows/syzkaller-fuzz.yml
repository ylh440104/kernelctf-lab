name: syzkaller-fuzz

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        required: true
        default: '43774253899'
      target:
        required: true
        default: 'hardened'
      fuzz_minutes:
        required: true
        default: '20'
      sandbox:
        required: true
        default: 'none'
      shard:
        required: true
        default: '0'
      corpus_run_id:
        description: 'run id of artifact to seed corpus from (0 = cold start)'
        required: true
        default: '0'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs debootstrap
          go version

      - name: build syzkaller
        run: |
          git clone --depth 1 https://github.com/google/syzkaller.git
          cd syzkaller
          make -j$(nproc) TARGETOS=linux TARGETVMARCH=amd64 TARGETARCH=amd64 all 2>&1 | tail -8
          ls -lh bin/linux_amd64/syz-executor

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: download kernel
        uses: actions/download-artifact@v4
        with:
          name: kernelobj-${{ github.event.inputs.target }}-kcov
          path: work/kernel
          run-id: ${{ github.event.inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: seed corpus
        if: ${{ github.event.inputs.corpus_run_id != '0' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: corpus-${{ github.event.inputs.target }}-shard${{ github.event.inputs.shard }}
          path: work/corpus-seed
          run-id: ${{ github.event.inputs.corpus_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: make rootfs and enable networking
        run: |
          mkdir -p work/img
          cd syzkaller/tools
          sudo env ADD_PACKAGE="isc-dhcp-client,ifupdown,iproute2,net-tools,openssh-server,curl,tar,gcc,libc6-dev,time,strace,sudo,less,psmisc" ./create-image.sh -d trixie
          sudo chown -R "$(id -u):$(id -g)" trixie.img trixie.id_rsa
          sudo mkdir -p /tmp/mnt
          sudo mount -o loop trixie.img /tmp/mnt
          sudo mkdir -p /tmp/mnt/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /lib/systemd/system/networking.service /tmp/mnt/etc/systemd/system/multi-user.target.wants/networking.service
          sudo umount /tmp/mnt
          cp trixie.img trixie.id_rsa "$GITHUB_WORKSPACE/work/img/"
          chmod 600 "$GITHUB_WORKSPACE/work/img/trixie.id_rsa"
          ls -lh "$GITHUB_WORKSPACE/work/img/"

      - name: write config
        run: |
          WS="$GITHUB_WORKSPACE"
          SB="${{ github.event.inputs.sandbox }}"
          sed -e "s|@WS@|$WS|g" -e "s|@SANDBOX@|$SB|g" "$WS/syz/syz-config.json" > work/config.cfg
          cat work/config.cfg
          mkdir -p work/syz-workdir

      - name: seed workdir
        if: ${{ github.event.inputs.corpus_run_id != '0' }}
        run: |
          if compgen -G "work/corpus-seed/*" > /dev/null; then
            mkdir -p work/syz-workdir/corpus
            cp -v work/corpus-seed/* work/syz-workdir/corpus/ 2>/dev/null | wc -l
            ls work/syz-workdir/corpus | wc -l
          else
            echo "no seed artifact content, cold start"
          fi

      - name: run syz-manager
        run: |
          cd work
          MINS=${{ github.event.inputs.fuzz_minutes }}
          "$GITHUB_WORKSPACE/syzkaller/bin/syz-manager" -config config.cfg > syz-manager.log 2>&1 &
          MPID=$!
          echo "manager pid $MPID, run for $MINS minutes"
          for i in $(seq 1 $MINS); do
            sleep 60
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- minute $i ---"
              grep -E 'exec total|crash' syz-manager.log | tail -3 || true
            fi
          done
          pkill -INT -f 'syz-manager' || true
          sleep 25
          pkill -f 'syz-manager' || true
          echo "=== manager stopped ==="
          ls syz-workdir/corpus 2>/dev/null | wc -l || true

      - name: collect results
        if: always()
        run: |
          if [ ! -d work ]; then echo "WORK_DIR_MISSING"; exit 0; fi
          cd work
          echo "=========== HEAD 80 ==========="
          head -80 syz-manager.log 2>/dev/null
          echo "=========== TAIL 60 ==========="
          tail -60 syz-manager.log 2>/dev/null
          echo "=========== crash count ==========="
          find syz-workdir/crashes -name '*.log' 2>/dev/null | wc -l
          echo "=========== crash files ==========="
          find syz-workdir/crashes -type f 2>/dev/null | head -20
          echo "=========== all VM events ==========="
          grep -E 'VM [0-9]:|boot error|exec total' syz-manager.log 2>/dev/null | tail -30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-${{ github.event.inputs.target }}-shard${{ github.event.inputs.shard }}
          path: work/syz-workdir/corpus
          if-no-files-found: warn
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syz-results-${{ github.event.inputs.target }}-shard${{ github.event.inputs.shard }}
          path: |
            work/syz-manager.log
            work/config.cfg
            work/syz-workdir/crashes/**
          if-no-files-found: warn
          retention-days: 90