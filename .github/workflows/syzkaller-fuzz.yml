name: syzkaller-fuzz

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag with kernel artifacts'
        required: true
        default: 'kcov-v3-1'
      target:
        description: 'lts-kasan or hardened'
        required: true
        default: 'lts-kasan'
      fuzz_minutes:
        description: 'Fuzz duration in minutes'
        required: true
        default: '180'
      sandbox:
        description: 'sandbox mode: none or setuid'
        required: true
        default: 'none'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs \
            build-essential flex bison libssl-dev libelf-dev libncurses-dev \
            bc pkg-config debootstrap
          go version

      - name: build syzkaller
        run: |
          git clone --depth 1 https://github.com/google/syzkaller.git
          cd syzkaller
          make -j$(nproc) TARGETOS=linux TARGETARCH=amd64 binaries
          ls -lh bin/

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm && echo KVM_READY || echo KVM_FAIL

      - name: download kernel from release
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          BASE="https://github.com/ylh440104/kernelctf-lab/releases/download/$TAG"
          TGT="${{ github.event.inputs.target }}"
          if [ "$TGT" = "hardened" ]; then N=hardened-kcov; else N=lts-kasan-kcov; fi
          mkdir -p work/kernel work/img
          curl -fsSL "$BASE/kernel-$N/bzImage" -o work/kernel/bzImage
          curl -fsSL "$BASE/kernel-$N/vmlinux" -o work/kernel/vmlinux
          chmod +x work/kernel/bzImage
          ls -lh work/kernel/
          file work/kernel/vmlinux | head -2

      - name: make rootfs
        run: |
          cd syzkaller/tools
          sudo ./create-image.sh -d bullseye
          sudo chown -R "$(id -u):$(id -g)" bullseye.img bullseye.id_rsa
          cp bullseye.img bullseye.id_rsa "$GITHUB_WORKSPACE/work/img/"
          cd "$GITHUB_WORKSPACE/work/img"
          chmod 600 bullseye.id_rsa
          ls -lh

      - name: sanity boot test
        run: |
          qemu-system-x86_64 -accel kvm -m 2048 -smp 2 \
            -kernel work/kernel/bzImage \
            -drive file=work/img/bullseye.img,format=raw,if=virtio \
            -append "root=/dev/vda console=ttyS0" \
            -nographic -no-reboot > boot-test.log 2>&1 &
          QPID=$!
          sleep 75
          kill $QPID 2>/dev/null || true
          sleep 2
          echo "=== head ==="
          head -50 boot-test.log
          echo "=== tail ==="
          tail -30 boot-test.log
          if grep -qE 'login:|syzbot login' boot-test.log; then echo BOOT_OK; else echo BOOT_FAIL; fi

      - name: write config
        run: |
          WS="$GITHUB_WORKSPACE"
          SB="${{ github.event.inputs.sandbox }}"
          sed -e "s|@WS@|$WS|g" -e "s|@SANDBOX@|$SB|g" "$WS/syz/syz-config.json" > work/config.cfg
          cat work/config.cfg
          mkdir -p work/syz-workdir

      - name: run syz-manager
        run: |
          cd work
          MINS=${{ github.event.inputs.fuzz_minutes }}
          sudo -E "$GITHUB_WORKSPACE/syzkaller/bin/syz-manager" -config config.cfg > syz-manager.log 2>&1 &
          sleep $(( MINS * 60 ))
          sudo pkill -INT -f syz-manager || true
          sleep 20
          sudo pkill -f syz-manager || true
          echo "=== manager stopped ==="

      - name: collect results
        if: always()
        run: |
          cd work
          echo "=== crash count ==="
          find syz-workdir/crashes -name '*.log' 2>/dev/null | wc -l
          echo "=== crash files ==="
          find syz-workdir/crashes -name '*.log' 2>/dev/null | head -20
          echo "=== manager log tail ==="
          tail -60 syz-manager.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syz-results
          path: |
            work/syz-manager.log
            work/config.cfg
            work/syz-workdir/crashes/**
            boot-test.log
          retention-days: 90