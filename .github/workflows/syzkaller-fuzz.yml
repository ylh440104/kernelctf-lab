name: syzkaller-fuzz

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Run ID of build-kcov-v3'
        required: true
        default: '43774253899'
      target:
        description: 'hardened or lts-kasan'
        required: true
        default: 'hardened'
      fuzz_minutes:
        description: 'Fuzz duration in minutes'
        required: true
        default: '15'
      sandbox:
        description: 'sandbox: none or setuid'
        required: true
        default: 'none'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs \
            build-essential flex bison libssl-dev libelf-dev libncurses-dev \
            bc pkg-config debootstrap
          go version

      - name: build syzkaller
        run: |
          git clone --depth 1 https://github.com/google/syzkaller.git
          cd syzkaller
          make -j$(nproc) TARGETOS=linux TARGETVMARCH=amd64 TARGETARCH=amd64 all 2>&1 | tail -15
          ls -lh bin/ | head -10

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm && echo KVM_READY || echo KVM_FAIL

      - name: download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: kernelobj-${{ github.event.inputs.target }}-kcov
          path: work/kernel
          run-id: ${{ github.event.inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: make rootfs with dhcp client
        run: |
          mkdir -p work/img
          cd syzkaller/tools
          echo "=== 关键: 加装 isc-dhcp-client + ifupdown，否则 /etc/network/interfaces 的 dhcp 配置不会生效 ==="
          sudo env ADD_PACKAGE="isc-dhcp-client,ifupdown,iproute2,net-tools,openssh-server,curl,tar,gcc,libc6-dev,time,strace,sudo,less,psmisc" \
            ./create-image.sh -d bullseye
          sudo chown -R "$(id -u):$(id -g)" bullseye.img bullseye.id_rsa
          echo "=== 验证镜像内是否有 dhclient ==="
          sudo mkdir -p /tmp/mnt
          sudo mount -o loop bullseye.img /tmp/mnt
          sudo ls -la /tmp/mnt/sbin/dhclient 2>/dev/null || echo NO_DHCLIENT
          sudo ls -la /tmp/mnt/sbin/ifup 2>/dev/null || echo NO_IFUP
          sudo cat /tmp/mnt/etc/network/interfaces
          sudo umount /tmp/mnt
          cp bullseye.img bullseye.id_rsa "$GITHUB_WORKSPACE/work/img/"
          ls -lh "$GITHUB_WORKSPACE/work/img/"

      - name: write config
        run: |
          WS="$GITHUB_WORKSPACE"
          SB="${{ github.event.inputs.sandbox }}"
          sed -e "s|@WS@|$WS|g" -e "s|@SANDBOX@|$SB|g" "$WS/syz/syz-config.json" > work/config.cfg
          cat work/config.cfg
          mkdir -p work/syz-workdir

      - name: run syz-manager
        run: |
          cd work
          MINS=${{ github.event.inputs.fuzz_minutes }}
          echo "=== 关键改动: 不用 sudo（/dev/kvm 已 0666，文件属 runner），避免 sudo 破坏 ssh 管道 ==="
          "$GITHUB_WORKSPACE/syzkaller/bin/syz-manager" -config config.cfg > syz-manager.log 2>&1 &
          MPID=$!
          echo "manager pid $MPID, will run for $MINS minutes"
          for i in $(seq 1 $MINS); do
            sleep 60
            if [ $((i % 3)) -eq 0 ]; then
              echo "--- minute $i ---"
              grep -E 'executed programs|corpus|coverage|crash' syz-manager.log | tail -3 || true
            fi
          done
          pkill -INT -f 'syz-manager' || true
          sleep 25
          pkill -f 'syz-manager' || true
          echo "=== manager stopped ==="

      - name: collect results
        if: always()
        run: |
          if [ ! -d work ]; then echo "WORK_DIR_MISSING"; exit 0; fi
          cd work
          echo "=========== HEAD 100 ==========="
          head -100 syz-manager.log 2>/dev/null || echo NO_LOG
          echo "=========== TAIL 60 ==========="
          tail -60 syz-manager.log 2>/dev/null || echo NO_LOG
          echo "=========== crashes ==========="
          find syz-workdir/crashes -name '*.log' 2>/dev/null | wc -l
          echo "=========== keywords ==========="
          grep -inE 'executor|kcov|enable|fail|error|denied' syz-manager.log 2>/dev/null | head -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syz-results
          path: |
            work/syz-manager.log
            work/config.cfg
            work/syz-workdir/crashes/**
          if-no-files-found: warn
          retention-days: 90