name: verify-kcov

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to verify'
        required: false
        default: 'kcov-1'
  push:
    branches: [main]
    paths: ['verify/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 cpio gzip curl busybox-static

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: download release artifacts
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          [ -z "$TAG" ] && TAG=kcov-1
          echo "TAG=$TAG"
          mkdir -p dist
          BASE="https://github.com/ylh440104/kernelctf-lab/releases/download/$TAG"
          for f in bzImage-lts-kasan-kcov bzImage-hardened-kcov config-lts-kasan-kcov config-hardened-kcov; do
            curl -fsSL "$BASE/$f" -o "dist/$f"
          done
          ls -lh dist/

      - name: verify config has KCOV
        run: |
          echo "===== lts-kasan-kcov ====="
          grep -E 'CONFIG_KCOV|CONFIG_KASAN=|CONFIG_DEBUG_FS=' dist/config-lts-kasan-kcov || true
          echo "===== hardened-kcov ====="
          grep -E 'CONFIG_KCOV|CONFIG_KASAN=|CONFIG_SLAB_VIRTUAL=|CONFIG_KMALLOC_PARTITION_TYPED=' dist/config-hardened-kcov || true

      - name: build kcov initramfs
        run: |
          rm -rf rootfs
          mkdir -p rootfs/bin rootfs/proc rootfs/sys rootfs/dev rootfs/tmp
          cp /bin/busybox rootfs/bin/busybox
          for a in sh mount cat grep tr cut ls uname echo poweroff sleep head wc; do
            ln -sf busybox "rootfs/bin/$a"
          done
          cat > rootfs/init <<'INIT'
          #!/bin/sh
          export PATH=/bin
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev 2>/dev/null
          echo "KCOV_TEST_KERNEL=$(uname -r)"
          echo "--- /sys/kernel/debug present? ---"
          ls -d /sys/kernel/debug 2>/dev/null || echo NO_DEBUGFS_DIR
          mount -t debugfs none /sys/kernel/debug 2>/dev/null && echo DEBUGFS_MOUNT_OK || echo DEBUGFS_MOUNT_FAIL
          echo "--- /sys/kernel/debug/kcov ---"
          if [ -e /sys/kernel/debug/kcov ]; then
            echo "KCOV_DEVICE_PRESENT yes"
            ls -l /sys/kernel/debug/kcov
          else
            echo "KCOV_DEVICE_PRESENT no"
          fi
          echo "--- kcov syscall check ---"
          cat /proc/kallsyms 2>/dev/null | grep -c kcov | head -1
          echo "KCOV_TEST_DONE"
          sync
          poweroff -f
          INIT
          chmod +x rootfs/init
          chmod +x rootfs/bin/busybox
          cd rootfs && find . | cpio -o -H newc 2>/dev/null | gzip -9 > ../initramfs.cpio.gz
          cd .. && ls -lh initramfs.cpio.gz

      - name: boot lts-kasan-kcov
        run: |
          echo "=========== lts-kasan-kcov ==========="
          timeout 240 qemu-system-x86_64 -accel kvm -m 3072 -M q35 -smp 2 \
            -cpu host -kernel dist/bzImage-lts-kasan-kcov -initrd initramfs.cpio.gz \
            -append "console=ttyS0 panic=-1" -nographic -no-reboot 2>&1 | tail -40 || true

      - name: boot hardened-kcov
        run: |
          echo "=========== hardened-kcov ==========="
          timeout 240 qemu-system-x86_64 -accel kvm -m 2048 -M q35 -smp 2 \
            -cpu host -kernel dist/bzImage-hardened-kcov -initrd initramfs.cpio.gz \
            -append "console=ttyS0 panic=-1" -nographic -no-reboot 2>&1 | tail -40 || true