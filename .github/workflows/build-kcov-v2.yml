name: build-kcov-v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lts-kasan-kcov
            config_url: https://storage.googleapis.com/kernelctf-build/releases/lts-6.12.116-kasan/.config
            repo: https://github.com/gregkh/linux
            commit: 5c40a1750f44dd6c7292d8c8d0b4ffff1734576e
          - target: hardened-kcov
            config_url: https://storage.googleapis.com/kernelctf-build/releases/hardened-v1-7.2-rc5/.config
            repo: https://github.com/thejh/linux
            commit: 699594e8888db3d7fa9bbaec1323371416e6489e

    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libssl-dev \
            libelf-dev bc cpio gzip xz-utils wget rsync libncurses-dev python3
          gcc --version | head -1

      - name: fetch kernel source
        run: |
          git init -q linux
          cd linux
          git remote add origin ${{ matrix.repo }}
          echo "repo=${{ matrix.repo }} sha=${{ matrix.commit }}"
          time git fetch --depth 1 origin ${{ matrix.commit }}
          git checkout FETCH_HEAD
          echo "=== HEAD ==="
          git rev-parse HEAD
          echo "=== VERSION ==="
          head -5 Makefile

      - name: download target config
        run: |
          curl -fsSL "${{ matrix.config_url }}" -o linux/.config
          wc -l linux/.config

      - name: enable KCOV
        run: |
          cd linux
          ./scripts/config --file .config \
            -e KCOV \
            -e KCOV_ENABLE_COMPARISONS \
            -e KCOV_INSTRUMENT_ALL \
            -e DEBUG_FS
          ./scripts/config --file .config -d MODULE_SIG -d MODULE_SIG_ALL || true
          time make olddefconfig
          echo "===== verify ====="
          grep -E 'CONFIG_KCOV|CONFIG_KASAN=|CONFIG_SLAB_VIRTUAL=|CONFIG_KMALLOC_PARTITION_TYPED=|CONFIG_DEBUG_FS=' .config
          echo "===== version after olddefconfig ====="
          head -5 Makefile

      - name: build kernel
        run: |
          cd linux
          echo "nproc=$(nproc)"
          time make -j$(nproc) bzImage 2>&1 | tail -50

      - name: verify built kernel version
        run: |
          cd linux
          file arch/x86/boot/bzImage
          strings arch/x86/boot/bzImage | grep -m3 -E 'Linux version [0-9]' || true
          ls -lh arch/x86/boot/bzImage
          df -h /

      - name: package
        run: |
          mkdir -p dist
          cp linux/arch/x86/boot/bzImage "dist/bzImage-${{ matrix.target }}"
          cp linux/.config "dist/config-${{ matrix.target }}"
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: dist/*
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -lhR dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kcov-v2-${{ github.run_number }}
          name: KCOV kernels v2 build ${{ github.run_number }}
          body: |
            kernelCTF KCOV kernels (fixed)

            Source mapping (from official COMMIT_INFO):
            - hardened-kcov: thejh/linux @ 699594e8888db3d7fa9bbaec1323371416e6489e (7.2-rc5)
            - lts-kasan-kcov: gregkh/linux @ 5c40a1750f44dd6c7292d8c8d0b4ffff1734576e (6.12.116)

            v1 的 lts-kasan-kcov 用错源码仓库（误用 thejh 的 7.2 树配 LTS 配置），
            实际编出 7.2.0-rc5 内核，无法启动。v2 已修正。

            新增 CONFIG_KCOV + KCOV_ENABLE_COMPARISONS + KCOV_INSTRUMENT_ALL
          files: dist/*
          draft: false
          prerelease: false