name: syz-netdiag

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        required: true
        default: '43774253899'
      target:
        required: true
        default: 'hardened'

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs debootstrap

      - name: build syzkaller
        run: |
          git clone --depth 1 https://github.com/google/syzkaller.git
          cd syzkaller
          make -j$(nproc) TARGETOS=linux TARGETVMARCH=amd64 TARGETARCH=amd64 all 2>&1 | tail -5

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: download kernel
        uses: actions/download-artifact@v4
        with:
          name: kernelobj-${{ github.event.inputs.target }}-kcov
          path: work/kernel
          run-id: ${{ github.event.inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: build rootfs
        run: |
          mkdir -p work/img
          cd syzkaller/tools
          sudo env ADD_PACKAGE="isc-dhcp-client,ifupdown,iproute2,net-tools,openssh-server,curl,tar,strace,sudo,psmisc,iputils-ping" ./create-image.sh -d bullseye
          sudo chown -R "$(id -u):$(id -g)" bullseye.img bullseye.id_rsa
          sudo mkdir -p /tmp/mnt
          sudo mount -o loop bullseye.img /tmp/mnt
          sudo mkdir -p /tmp/mnt/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /lib/systemd/system/networking.service /tmp/mnt/etc/systemd/system/multi-user.target.wants/networking.service
          sudo umount /tmp/mnt
          cp bullseye.img bullseye.id_rsa "$GITHUB_WORKSPACE/work/img/"

      - name: boot with syzkaller default IDE disk and inspect network
        run: |
          set -x
          IMG="$GITHUB_WORKSPACE/work/img/bullseye.img"
          KEY="$GITHUB_WORKSPACE/work/img/bullseye.id_rsa"
          chmod 600 "$KEY"
          # 完全模拟 syzkaller 的 qemu 参数: -hda (IDE) + user net + hostfwd
          qemu-system-x86_64 -enable-kvm -cpu host -m 2048 -smp 2 \
            -kernel work/kernel/bzImage \
            -hda "$IMG" \
            -append "root=/dev/sda console=ttyS0 oops=panic panic=1 net.ifnames=0" \
            -net nic,model=e1000 -net user,hostfwd=tcp::10022-:22 \
            -nographic -no-reboot > vmnet.log 2>&1 &
          QPID=$!
          echo "qemu=$QPID"
          for t in 1 2 3 4 5 6; do
            sleep 25
            echo "=== t=$t ping test ==="
            nc -z -w 3 127.0.0.1 10022 && echo PORT_OPEN && break || echo port_closed
          done
          SSH="ssh -i $KEY -p 10022 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o LogLevel=ERROR root@127.0.0.1"
          echo "=== ssh attempt ==="
          $SSH 'echo SSH_OK; uname -r; ip -4 addr; ip route; systemctl is-active networking; systemctl status networking --no-pager -l | head -20; journalctl -u networking --no-pager | tail -30' 2>&1 || echo SSH_FAILED
          echo "=== dmesg net ==="
          $SSH 'dmesg | grep -iE "e1000|eth0|link up" | head -20' 2>&1 || true
          kill $QPID 2>/dev/null || true
          sleep 2
          echo "=== vmnet.log network part ==="
          grep -iE 'e1000|eth0|dhcp|network' vmnet.log | head -25
          echo "=== vmnet.log tail ==="
          tail -15 vmnet.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netdiag
          path: vmnet.log
          retention-days: 30