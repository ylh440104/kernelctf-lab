name: fetch-src
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: shallow clone kernelctf target source
        run: |
          SHA=699594e8888db3d7fa9bbaec1323371416e6489e
          git init -q linux
          cd linux
          git remote add origin https://github.com/thejh/linux.git
          echo "=== fetching $SHA ==="
          time git fetch --depth 1 origin $SHA
          git checkout FETCH_HEAD
          echo "=== HEAD ==="
          git log -1 --oneline
          echo "=== size ==="
          du -sh .
          du -sh .git
          echo "=== tree top ==="
          ls | head -30
          echo "=== VERSION ==="
          head -5 Makefile

      - name: make source tarball
        run: |
          cd linux
          tar czf ../linux-src.tar.gz --exclude=.git .
          cd ..
          ls -lh linux-src.tar.gz
          echo "SHA256=$(sha256sum linux-src.tar.gz | cut -d' ' -f1)"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-src
          path: linux-src.tar.gz
          retention-days: 3
          compression-level: 0