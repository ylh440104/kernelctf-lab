name: futex2-stress
on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        required: true
        default: '45553135462'
      artifact_name:
        required: true
        default: 'kernel-72rc5-kasan'
      duration:
        required: true
        default: '120'
      instances:
        required: true
        default: '2'
      node:
        required: true
        default: '0'
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils e2fsprogs debootstrap gcc
      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: download kernel
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: work/kernel
          run-id: ${{ github.event.inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: verify kernel
        run: |
          find work/kernel -maxdepth 2 -type f | head -10
          file work/kernel/bzImage
          nm work/kernel/vmlinux 2>/dev/null | grep -c '__asan_load' || true
          nm work/kernel/vmlinux 2>/dev/null | grep -c 'futex_key_to_node_opt' || true
          nm work/kernel/vmlinux 2>/dev/null | grep -c 'futex_hash_allocate' || true
