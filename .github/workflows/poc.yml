name: poc
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 cpio gzip curl busybox-static gcc

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: download kernels
        run: |
          B=https://storage.googleapis.com/kernelctf-build/releases
          curl -fsSL "$B/lts-6.12.116-kasan/bzImage" -o bz-kasan
          curl -fsSL "$B/hardened-v1-7.2-rc5/bzImage" -o bz-hardened
          ls -lh bz-kasan bz-hardened

      - name: build pocs
        run: |
          mkdir -p out
          fail=0
          for f in pocs/*.c; do
            n=$(basename "$f" .c)
            if gcc -static -O2 -w -o "out/$n" "$f"; then
              echo "BUILD_OK $n"
            else
              echo "BUILD_FAIL $n"
              fail=1
            fi
          done
          ls -la out
          exit $fail

      - name: build initramfs
        run: |
          rm -rf rootfs
          mkdir -p rootfs/bin rootfs/poc rootfs/proc rootfs/sys rootfs/dev rootfs/tmp rootfs/etc
          cp /bin/busybox rootfs/bin/busybox
          for a in sh mount cat grep tr cut ls uname echo poweroff sleep setuidgid dmesg head tail wc; do
            ln -sf busybox "rootfs/bin/$a"
          done
          cp out/* rootfs/poc/
          gcc -static -O2 -w -o rootfs/bin/runas runner/runas.c
          cp runner/init rootfs/init
          printf 'root:x:0:0:root:/root:/bin/sh\nnobody:x:65534:65534:nobody:/:/bin/sh\n' > rootfs/etc/passwd
          printf 'root:x:0:\nnobody:x:65534:\n' > rootfs/etc/group
          chmod +x rootfs/init rootfs/bin/busybox
          chmod +x rootfs/poc/*
          cd rootfs
          find . | cpio -o -H newc 2>/dev/null | gzip -9 > ../initramfs.cpio.gz
          cd ..
          ls -lh initramfs.cpio.gz

      - name: run on lts-kasan
        run: |
          mkdir -p results
          for f in out/*; do
            n=$(basename "$f")
            echo "=========== $n @ lts-kasan ==========="
            timeout 300 qemu-system-x86_64 -accel kvm -m 3072 -M q35 -smp 2 \
              -cpu host -kernel bz-kasan -initrd initramfs.cpio.gz \
              -append "console=ttyS0 panic=-1 poc=$n" -nographic -no-reboot \
              > "results/$n.kasan.log" 2>&1 || true
            echo "--- verdict ---"
            if grep -q "KASAN:" "results/$n.kasan.log"; then echo "VERDICT $n KASAN"; 
            elif grep -qE "kernel panic|BUG:|general protection|Oops" "results/$n.kasan.log"; then echo "VERDICT $n CRASH";
            elif grep -q "POC_OK" "results/$n.kasan.log"; then echo "VERDICT $n OK";
            else echo "VERDICT $n UNKNOWN"; fi
            tail -20 "results/$n.kasan.log" || true
          done

      - name: run on hardened
        run: |
          for f in out/*; do
            n=$(basename "$f")
            echo "=========== $n @ hardened ==========="
            timeout 300 qemu-system-x86_64 -accel kvm -m 2048 -M q35 -smp 2 \
              -cpu host -kernel bz-hardened -initrd initramfs.cpio.gz \
              -append "console=ttyS0 panic=-1 poc=$n" -nographic -no-reboot \
              > "results/$n.hardened.log" 2>&1 || true
            echo "--- verdict ---"
            if grep -qE "kernel panic|BUG:|general protection|Oops" "results/$n.hardened.log"; then echo "VERDICT $n CRASH";
            elif grep -q "POC_OK" "results/$n.hardened.log"; then echo "VERDICT $n OK";
            else echo "VERDICT $n UNKNOWN"; fi
            tail -20 "results/$n.hardened.log" || true
          done

      - name: summary
        run: |
          echo "===== SUMMARY ====="
          for f in results/*.log; do
            n=$(basename "$f")
            if grep -q "KASAN:" "$f"; then v=KASAN
            elif grep -qE "kernel panic|BUG:|general protection|Oops" "$f"; then v=CRASH
            elif grep -q "POC_OK" "$f"; then v=OK
            else v=UNKNOWN; fi
            printf '%-40s %s\n' "$n" "$v"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-results
          path: results/